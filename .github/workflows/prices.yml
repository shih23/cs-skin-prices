# Раз в сутки (после обновления prices.csgotrader.app ~10:25 UTC) считает цены скинов
# и выкладывает prices.json + history.json на GitHub Pages. В git цены не коммитятся:
# прошлую историю берём с самого сайта, поэтому репозиторий не растёт.
name: prices

on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install brotli
      - name: Прошлая история с сайта
        run: |
          mkdir -p site
          curl -sfL --compressed -o site/history.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" || rm -f site/history.json
      - name: Цены
        run: python live_prices.py --list skins.json --out site --history
      - name: Сайт
        run: |
          rm -rf site/src
          cp README.md site/index.md 2>/dev/null || true
          cp privacy.html site/privacy.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub выключает расписание в публичном репозитории, если в нём 60 дней нет активности.
  # Раз в месяц (1-го числа) пустой коммит от бота - расписание не отключится никогда.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Пустой коммит раз в месяц
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%Y-%m)"
          git push
